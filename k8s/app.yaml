apiVersion: apps/v1
kind: Deployment
metadata:
  name: campusworks-app
  namespace: campusworks
spec:
  # Session revocation and transactional state are shared in MongoDB.
  replicas: 2
  selector:
    matchLabels: { app: campusworks-app }
  template:
    metadata:
      labels: { app: campusworks-app }
    spec:
      containers:
        - name: campusworks
          image: campusworks:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: campusworks-app
          env:
            - name: NODE_ENV
              value: "production"
            - name: MONGODB_DB
              value: "campusworks"
            - name: ENABLE_MOCK_LOGIN
              value: "false"
            - name: SEED_DEMO_DATA
              value: "false"
            - name: TRUST_PROXY
              value: "false"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: campusworks
  namespace: campusworks
spec:
  type: NodePort
  selector: { app: campusworks-app }
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080  # http://localhost:30080
