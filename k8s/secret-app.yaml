# Application settings for the local demo cluster.
# For a real deployment, replace SESSION_SECRET with a random 32+ character
# value (it must be the same for every replica), set ENABLE_MOCK_LOGIN to
# "false" and configure GITLAB_* / ADMIN_EMAILS.
apiVersion: v1
kind: Secret
metadata:
  name: campusworks-app
  namespace: campusworks
type: Opaque
stringData:
  SESSION_SECRET: campusworks-k8s-demo-secret-change-me-0123456789
  ENABLE_MOCK_LOGIN: "true"
  SEED_DEMO_DATA: "true"
  ADMIN_EMAILS: ""
  ALLOWED_EMAIL_DOMAINS: ""
  GITLAB_BASE_URL: ""
  GITLAB_CLIENT_ID: ""
  GITLAB_CLIENT_SECRET: ""
