apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: campusworks
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      initContainers:
        - name: replica-key
          image: mongo:7
          command: ["bash", "-ec", "cp /secret/replica-key /keys/replica.key; chown 999:999 /keys/replica.key; chmod 400 /keys/replica.key"]
          volumeMounts:
            - { name: replica-secret, mountPath: /secret, readOnly: true }
            - { name: replica-key, mountPath: /keys }
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          envFrom:
            - secretRef:
                name: mongo-auth
          volumeMounts:
            - name: data
              mountPath: /data/db
            - { name: replica-key, mountPath: /keys, readOnly: true }
          args:
            - "--bind_ip_all"
            - "--auth"
            - "--replSet"
            - "rs0"
            - "--keyFile"
            - "/keys/replica.key"
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: replica-secret
          secret: { secretName: mongo-auth, defaultMode: 256 }
        - name: replica-key
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: campusworks
spec:
  selector: { app: mongo }
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
