apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: campusworks
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          envFrom:
            - secretRef:
                name: mongo-auth
          volumeMounts:
            - name: data
              mountPath: /data/db
          args:
            - "--bind_ip_all"
            - "--auth"
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: campusworks
spec:
  selector: { app: mongo }
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
