# Development credentials for the in-cluster MongoDB.
# Change these (or create the secret out-of-band) for any real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-auth
  namespace: campusworks
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: campusworks
  MONGO_INITDB_ROOT_PASSWORD: campusworks-dev
